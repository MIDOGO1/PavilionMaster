name: Build Pavilion Master (Windows)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Qt 6.7.3
        shell: pwsh
        run: |
          python -m pip install --upgrade aqtinstall
          python -m aqt install-qt windows desktop 6.7.3 win64_msvc2019_64 --outputdir C:\Qt --modules qtdeclarative qtshadertools

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="C:\Qt\6.7.3\msvc2019_64"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release

      - name: Collect app and Qt runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build\Release\app15GControlCetner.exe dist\
          & "C:\Qt\6.7.3\msvc2019_64\bin\windeployqt.exe" --release --qmldir . dist\app15GControlCetner.exe
          Copy-Item installer.bat dist\
          if (Test-Path licenses) { Copy-Item -Recurse licenses dist\licenses }

      - uses: actions/upload-artifact@v4
        with:
          name: PavilionMaster-exe
          path: dist/
