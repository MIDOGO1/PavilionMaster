name: Build Pavilion Master (Windows)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          arch: win64_msvc2019_64
          modules: 'qtquick qtshadertools qtdeclarative'
          cache: true

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$env:Qt6_DIR"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release

      - name: Collect artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build\app15GControlCetner.exe dist\
          Get-ChildItem -Path $env:Qt6_DIR\..\..\..\bin -Filter *.dll -ErrorAction SilentlyContinue | Out-Null
          Copy-Item installer.bat dist\ -ErrorAction SilentlyContinue
          Copy-Item -Recurse -ErrorAction SilentlyContinue licenses dist\licenses

      - uses: actions/upload-artifact@v4
        with:
          name: PavilionMaster-exe
          path: dist/
